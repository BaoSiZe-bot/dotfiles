# ~/.config/starship.toml
palette = "catppuccin_frappe"
format = """
[](blue)\
$username\
[](bg:green fg:blue)\
$directory\
[](fg:green bg:mauve)\
$git_branch\
$git_status\
[](bg:yellow fg:mauve)\
$time\
[ ](fg:yellow)
$character
"""

right_format = """
[](fg:mauve)\
$cmd_duration\
[](fg:mauve)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false
[character]
# Note the use of Catppuccin color 'peach'
success_symbol = "[󰄛  ](bold fg:green)"
error_symbol = "[󰄛  󰅙](bold fg:red)"
vimcmd_symbol = "[󰄛  ❮](bold fg:mauve)" # For use with fish-vi-mode

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:blue fg:base"
style_root = "bg:blue"
format = '[$user ]($style)'

[directory]
style = "bg:#a6d189 fg:base"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "

[c]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:mauve"
format = '[ $symbol $context ]($style) $path'

[elixir]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:mauve fg:base"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:mauve fg:base"
conflicted = "🏳"
ahead = "🏎💨"
behind = "😰"
diverged = "󰱮 "
untracked = " "
stashed = " "
modified = " "
staged = '[++\($count\)](green)'
renamed = " "
deleted = " "
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:mauve fg:base"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:mauve"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:yellow fg:base"
format = '[ ♥ $time ]($style)'

[cmd_duration]
min_time = 0
min_time_to_notify = 2_000
style = "bg:mauve fg:base"
format = '[  $duration ]($style)'

